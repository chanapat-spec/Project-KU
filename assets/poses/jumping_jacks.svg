<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFBEB"/><stop offset="100%" stop-color="#FEF3C7"/></linearGradient></defs>
  <style>.star { animation: jackStar 1s ease-in-out infinite alternate; } @keyframes jackStar { 0%{transform: scale(0.92);} 100%{transform: scale(1.04);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#F59E0B" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#B45309"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🔥 กระโดดตบรูปดาว (Jumping Jacks)</text>
  <ellipse cx="100" cy="175" rx="45" ry="6" fill="#FDE68A"/>
  <g class="star" style="transform-origin: 100px 100px;">
    <!-- Star legs wide -->
    <path d="M92 128 L64 168" stroke="#D97706" stroke-width="10" stroke-linecap="round"/>
    <rect x="56" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <path d="M108 128 L136 168" stroke="#D97706" stroke-width="10" stroke-linecap="round"/>
    <rect x="130" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <!-- Torso & Head -->
    <rect x="84" y="92" width="32" height="38" rx="7" fill="#F59E0B"/>
    <circle cx="100" cy="74" r="14" fill="#FCD34D"/><rect x="88" y="68" width="24" height="4" rx="2" fill="#EF4444"/>
    <!-- Star arms raised clapping overhead -->
    <path d="M84 96 L58 64 L86 48" stroke="#FCD34D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M116 96 L142 64 L114 48" stroke="#FCD34D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="100" cy="48" r="6" fill="#EF4444"/>
  </g>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#92400E" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">กระโดดกางแขนกางขา ตบมือเหนือหัว</text>
</svg>