<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFBEB"/><stop offset="100%" stop-color="#FEF3C7"/></linearGradient></defs>
  <style>.kick { animation: kickBack 0.8s ease-in-out infinite alternate; } @keyframes kickBack { 0%{transform: rotate(0deg);} 100%{transform: rotate(-10deg);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#F59E0B" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#B45309"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🔥 เตะส้นเท้าแตะก้น (Butt Kicks)</text>
  <ellipse cx="100" cy="175" rx="35" ry="6" fill="#FDE68A"/>
  <!-- Standing Leg -->
  <rect x="94" y="128" width="10" height="44" rx="4" fill="#D97706"/>
  <rect x="92" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <rect x="86" y="88" width="30" height="40" rx="7" fill="#F59E0B"/>
  <circle cx="102" cy="70" r="15" fill="#FCD34D"/><rect x="89" y="64" width="26" height="4.5" rx="2" fill="#EF4444"/>
  <!-- Butt Kick Leg -->
  <g class="kick" style="transform-origin: 86px 128px;">
    <path d="M86 128 L84 146 L68 132" stroke="#D97706" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="68" cy="132" r="6" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <!-- Curved back kick motion arrow -->
    <path d="M74 154 Q64 146 66 136" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-dasharray="3,3"/>
    <polygon points="64,134 68,138 62,140" fill="#EF4444"/>
  </g>
  <path d="M86 96 L74 112" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
  <path d="M114 96 L126 112" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#92400E" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">วิ่งย่ำ ดีดส้นเท้าแตะก้นสลับข้าง</text>
</svg>