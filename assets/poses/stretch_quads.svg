<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ECFDF5"/><stop offset="100%" stop-color="#D1FAE5"/></linearGradient></defs>
  <style>.leg { animation: quadPull 2s ease-in-out infinite alternate; } @keyframes quadPull { 0%{transform: rotate(0deg);} 100%{transform: rotate(-4deg);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#10B981" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#065F46"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🧘 ยืดหน้าขาต้นขา (Quad Stretch)</text>
  <ellipse cx="100" cy="175" rx="35" ry="6" fill="#A7F3D0"/>
  <!-- Standing Left Leg -->
  <rect x="96" y="128" width="11" height="44" rx="4" fill="#047857"/>
  <rect x="94" y="166" width="15" height="8" rx="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.5"/>
  <!-- Torso & Head -->
  <rect x="86" y="90" width="32" height="40" rx="7" fill="#059669"/>
  <circle cx="102" cy="72" r="15" fill="#FCD34D"/><rect x="89" y="66" width="26" height="4.5" rx="2" fill="#EF4444"/>
  <!-- Bent Right Leg & Hand holding ankle -->
  <g class="leg" style="transform-origin: 86px 128px;">
    <!-- Front thigh highlight -->
    <rect x="78" y="128" width="10" height="24" rx="4" fill="#F59E0B" opacity="0.8"/>
    <!-- Bent lower leg pointing up-back -->
    <path d="M86 128 L82 148 L68 136" stroke="#047857" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="68" cy="136" r="6" fill="#FFFFFF" stroke="#065F46" stroke-width="1.5"/>
    <!-- Right Arm holding ankle -->
    <path d="M92 98 L70 120 L68 134" stroke="#FCD34D" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#10B981" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#065F46" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">พับขาไปหลัง มือจับข้อเท้าชิดก้น</text>
</svg>