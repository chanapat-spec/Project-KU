<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFBEB"/><stop offset="100%" stop-color="#FEF3C7"/></linearGradient></defs>
  <style>.runLeg { animation: kneeHop 0.8s ease-in-out infinite alternate; } @keyframes kneeHop { 0%{transform: translateY(0);} 100%{transform: translateY(-8px);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#F59E0B" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#B45309"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🔥 ยกเข่าสูงคึกคัก (High Knees)</text>
  <ellipse cx="100" cy="175" rx="35" ry="6" fill="#FDE68A"/>
  <!-- Standing Leg -->
  <rect x="84" y="128" width="10" height="44" rx="4" fill="#D97706"/>
  <rect x="81" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <!-- Torso & Head -->
  <rect x="84" y="88" width="32" height="40" rx="7" fill="#F59E0B"/>
  <circle cx="100" cy="70" r="15" fill="#FCD34D"/><rect x="87" y="64" width="26" height="4.5" rx="2" fill="#EF4444"/>
  <!-- High Knee Lift -->
  <g class="runLeg">
    <path d="M104 126 L126 112 L126 138" stroke="#D97706" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="120" y="136" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <!-- Up Arrow Indicator -->
    <path d="M138 126 L138 106" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <polygon points="138,102 134,108 142,108" fill="#EF4444"/>
  </g>
  <!-- Running Arms -->
  <path d="M84 96 L72 114 L62 108" stroke="#FCD34D" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M116 96 L128 106 L136 94" stroke="#FCD34D" stroke-width="6" stroke-linecap="round" fill="none"/>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#92400E" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ยกเข่าสูงระดับสะโพก สลับสองข้าง</text>
</svg>