<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFBEB"/><stop offset="100%" stop-color="#FEF3C7"/></linearGradient></defs>
  <style>.hop { animation: ankleBounce 0.6s ease-in-out infinite alternate; } @keyframes ankleBounce { 0%{transform: translateY(0);} 100%{transform: translateY(-14px);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#F59E0B" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#B45309"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🔥 กระโดดสปริงข้อเท้า (Ankle Hops)</text>
  <ellipse cx="100" cy="175" rx="35" ry="6" fill="#FDE68A"/>
  <g class="hop">
    <!-- Legs together, spring on toes -->
    <rect x="88" y="120" width="10" height="44" rx="4" fill="#D97706"/>
    <rect x="102" y="120" width="10" height="44" rx="4" fill="#D97706"/>
    <!-- Pointed toe sneakers in air -->
    <rect x="86" y="162" width="13" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <rect x="101" y="162" width="13" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <rect x="84" y="84" width="32" height="38" rx="7" fill="#F59E0B"/>
    <circle cx="100" cy="66" r="15" fill="#FCD34D"/><rect x="87" y="60" width="26" height="4.5" rx="2" fill="#EF4444"/>
    <!-- Hands on waist -->
    <path d="M84 92 L72 104 L84 108" stroke="#FCD34D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M116 92 L128 104 L116 108" stroke="#FCD34D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Spring lines on ground -->
  <path d="M74 172 Q100 162 126 172" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#92400E" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">เด้งสปริงปลายเท้าเบาๆ ต่อเนื่อง</text>
</svg>