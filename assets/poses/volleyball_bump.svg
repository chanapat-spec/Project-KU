<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#EEF2FF"/><stop offset="100%" stop-color="#E0E7FF"/></linearGradient></defs>
  <style>.bump { animation: bumpAnim 1.6s ease-in-out infinite alternate; } @keyframes bumpAnim { 0%{transform: translateY(0);} 100%{transform: translateY(10px);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#6366F1" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#4338CA"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🏐 อันเดอร์บอล (Underhand Bump)</text>
  <ellipse cx="100" cy="175" rx="45" ry="6" fill="#C7D2FE"/>
  <g class="bump">
    <!-- Squatting legs -->
    <path d="M84 126 L66 144 L66 168" stroke="#4F46E5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="60" y="166" width="15" height="8" rx="3" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
    <path d="M116 126 L134 144 L134 168" stroke="#4F46E5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="128" y="166" width="15" height="8" rx="3" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.5"/>
    <rect x="84" y="92" width="32" height="36" rx="7" fill="#006837"/>
    <circle cx="100" cy="74" r="14" fill="#FCD34D"/><rect x="88" y="68" width="24" height="4" rx="2" fill="#EF4444"/>
    <!-- Arms locked straight reaching forward together -->
    <path d="M84 98 L114 116" stroke="#FCD34D" stroke-width="7" stroke-linecap="round"/>
    <path d="M116 98 L114 116" stroke="#FCD34D" stroke-width="7" stroke-linecap="round"/>
    <rect x="112" y="112" width="8" height="8" rx="2" fill="#10B981"/>
    <!-- Volleyball in air -->
    <circle cx="134" cy="80" r="12" fill="#FCD34D" stroke="#1E3A8A" stroke-width="2"/>
  </g>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#6366F1" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#312E81" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ย่อเข่า แขนประกบเหยียดตึงเสมอ</text>
</svg>