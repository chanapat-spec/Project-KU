<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFBEB"/><stop offset="100%" stop-color="#FEF3C7"/></linearGradient></defs>
  <style>.circleArm { animation: armSpin 2s linear infinite; } @keyframes armSpin { 0%{transform: rotate(0deg);} 100%{transform: rotate(360deg);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#F59E0B" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#B45309"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🔥 หมุนแขนวงกลม (Arm Circles)</text>
  <ellipse cx="100" cy="175" rx="35" ry="6" fill="#FDE68A"/>
  <rect x="86" y="130" width="10" height="42" rx="4" fill="#D97706"/>
  <rect x="104" y="130" width="10" height="42" rx="4" fill="#D97706"/>
  <rect x="83" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <rect x="103" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <rect x="82" y="92" width="36" height="40" rx="7" fill="#F59E0B"/>
  <circle cx="100" cy="72" r="15" fill="#FCD34D"/><rect x="87" y="66" width="26" height="4.5" rx="2" fill="#EF4444"/>
  <!-- Outstretched arms with rotating circle cues -->
  <path d="M82 102 L46 102" stroke="#FCD34D" stroke-width="8" stroke-linecap="round"/>
  <path d="M118 102 L154 102" stroke="#FCD34D" stroke-width="8" stroke-linecap="round"/>
  <!-- Rotating swirl rings at hands -->
  <g class="circleArm" style="transform-origin: 46px 102px;">
    <circle cx="46" cy="102" r="16" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="46,86 52,83 50,89" fill="#EF4444"/>
  </g>
  <g class="circleArm" style="transform-origin: 154px 102px;">
    <circle cx="154" cy="102" r="16" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="154,86 160,83 158,89" fill="#EF4444"/>
  </g>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#92400E" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">กางแขน หมุนเป็นวงกลมต่อเนื่อง</text>
</svg>