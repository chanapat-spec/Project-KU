<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ECFDF5"/><stop offset="100%" stop-color="#D1FAE5"/></linearGradient></defs>
  <style>.lunge { animation: lungeDeep 2.2s ease-in-out infinite alternate; } @keyframes lungeDeep { 0%{transform: translateX(0);} 100%{transform: translateX(4px);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#10B981" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#065F46"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🧘 ยืดน่องเอ็นร้อยหวาย (Calf Runner)</text>
  <ellipse cx="100" cy="175" rx="50" ry="6" fill="#A7F3D0"/>
  <!-- Back Leg Straight, Heel Flat (Calf stretched!) -->
  <path d="M88 126 L62 152 L48 168" stroke="#047857" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="40" y="166" width="16" height="8" rx="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.5"/>
  <!-- Calf muscle highlight -->
  <path d="M66 148 L54 162" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <!-- Front Leg Bent Forward -->
  <g class="lunge">
    <path d="M94 126 L124 144 L126 168" stroke="#047857" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="120" y="166" width="16" height="8" rx="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.5"/>
    <!-- Torso leaning forward slightly -->
    <rect x="84" y="92" width="30" height="38" rx="7" fill="#059669"/>
    <circle cx="104" cy="74" r="14" fill="#FCD34D"/><rect x="92" y="68" width="24" height="4" rx="2" fill="#EF4444"/>
    <path d="M92 98 L114 126" stroke="#FCD34D" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#10B981" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#065F46" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ขาหลังเหยียดตึง ส้นเท้าราบชิดพื้น</text>
</svg>