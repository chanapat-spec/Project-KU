    <path d="M96 82 Q100 86 104 82" stroke="#1F2937" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M116 95 Q126 73 108 63" stroke="#FCD34D" stroke-width="7" fill="none" stroke-linecap="round"/>
