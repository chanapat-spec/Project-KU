<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFBEB"/><stop offset="100%" stop-color="#FEF3C7"/></linearGradient></defs>
  <style>.twist { animation: torsoSpin 1.6s ease-in-out infinite alternate; transform-origin: 100px 105px; } @keyframes torsoSpin { 0%{transform: rotate(-14deg);} 100%{transform: rotate(14deg);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#F59E0B" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#B45309"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🔥 บิดลำตัวสลับข้าง (Torso Twist)</text>
  <ellipse cx="100" cy="175" rx="35" ry="6" fill="#FDE68A"/>
  <!-- Standing Legs -->
  <rect x="84" y="132" width="10" height="40" rx="4" fill="#D97706"/>
  <rect x="106" y="132" width="10" height="40" rx="4" fill="#D97706"/>
  <rect x="81" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <rect x="105" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
  <!-- Twisting upper body -->
  <g class="twist">
    <rect x="82" y="92" width="36" height="40" rx="7" fill="#F59E0B"/>
    <circle cx="100" cy="72" r="15" fill="#FCD34D"/><rect x="87" y="66" width="26" height="4.5" rx="2" fill="#EF4444"/>
    <!-- Arms bent in front of chest twisting left/right -->
    <path d="M82 98 L60 98 L78 112" stroke="#FCD34D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M118 98 L140 98 L122 112" stroke="#FCD34D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Curved motion arrows -->
  <path d="M64 80 Q100 60 136 80" stroke="#EF4444" stroke-width="2.5" stroke-dasharray="3,3" fill="none"/>
  <polygon points="60,82 66,78 68,84" fill="#EF4444"/>
  <polygon points="140,82 134,78 132,84" fill="#EF4444"/>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#92400E" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ยกแขนระดับอก บิดเอวซ้าย-ขวา</text>
</svg>