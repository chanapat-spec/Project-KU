<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFBEB"/><stop offset="100%" stop-color="#FEF3C7"/></linearGradient></defs>
  <style>.lunge { animation: lungeS 2s ease-in-out infinite alternate; } @keyframes lungeS { 0%{transform: translateX(-6px);} 100%{transform: translateX(6px);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#F59E0B" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#B45309"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🔥 สไลด์ย่อข้าง (Side Lunges)</text>
  <ellipse cx="100" cy="175" rx="55" ry="6" fill="#FDE68A"/>
  <g class="lunge">
    <!-- Extended leg -->
    <path d="M92 132 L54 154 L44 168" stroke="#D97706" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="36" y="166" width="15" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <!-- Bent leg -->
    <path d="M106 132 L134 144 L134 168" stroke="#D97706" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="128" y="166" width="15" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <rect x="86" y="96" width="32" height="36" rx="7" fill="#F59E0B"/>
    <circle cx="102" cy="78" r="14" fill="#FCD34D"/><rect x="90" y="72" width="24" height="4" rx="2" fill="#EF4444"/>
    <path d="M88 104 L78 126" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
    <path d="M114 104 L124 126" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
  </g>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#92400E" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ก้าวเท้าออกข้าง ย่อสะโพกสลับข้าง</text>
</svg>