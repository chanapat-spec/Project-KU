<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ECFDF5"/><stop offset="100%" stop-color="#D1FAE5"/></linearGradient></defs>
  <style>.bend { animation: hamBend 2.2s ease-in-out infinite alternate; transform-origin: 85px 126px; } @keyframes hamBend { 0%{transform: rotate(0deg);} 100%{transform: rotate(10deg);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#10B981" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#065F46"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🧘 ยืดหลังขา (Hamstring Stretch)</text>
  <ellipse cx="100" cy="175" rx="45" ry="6" fill="#A7F3D0"/>
  <!-- Back slightly bent leg -->
  <path d="M82 126 L76 150 L74 168" stroke="#047857" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="68" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.5"/>
  <!-- Front leg extended straight, heel down toe up -->
  <path d="M86 126 L118 152 L136 166" stroke="#047857" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M134 168 L146 158" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  <!-- Back of thigh highlight -->
  <path d="M98 138 L124 158" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <g class="bend">
    <rect x="72" y="94" width="32" height="36" rx="7" fill="#059669"/>
    <circle cx="84" cy="78" r="14" fill="#FCD34D"/><rect x="72" y="73" width="24" height="4" rx="2" fill="#EF4444"/>
    <!-- Arms reaching toward front foot -->
    <path d="M78 98 L114 136 L130 152" stroke="#FCD34D" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#10B981" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#065F46" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ก้าวขาหน้ากระดกปลายเท้า ก้มแตะยืดหลังขา</text>
</svg>