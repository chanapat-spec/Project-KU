<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FFFBEB"/><stop offset="100%" stop-color="#FEF3C7"/></linearGradient></defs>
  <style>.reachSky { animation: skyJump 1.2s ease-in-out infinite alternate; } @keyframes skyJump { 0%{transform: translateY(6px);} 100%{transform: translateY(-8px);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#F59E0B" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#B45309"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">🔥 เหยียดแขนแตะฟ้า (Sky Reach)</text>
  <ellipse cx="100" cy="175" rx="35" ry="6" fill="#FDE68A"/>
  <g class="reachSky">
    <rect x="86" y="124" width="10" height="46" rx="4" fill="#D97706"/>
    <rect x="104" y="124" width="10" height="46" rx="4" fill="#D97706"/>
    <rect x="83" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <rect x="103" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
    <rect x="82" y="88" width="36" height="38" rx="7" fill="#F59E0B"/>
    <circle cx="100" cy="70" r="15" fill="#FCD34D"/><rect x="87" y="64" width="26" height="4.5" rx="2" fill="#EF4444"/>
    <!-- Both arms shooting up to sky -->
    <path d="M84 92 L78 52" stroke="#FCD34D" stroke-width="7" stroke-linecap="round"/>
    <path d="M116 92 L122 52" stroke="#FCD34D" stroke-width="7" stroke-linecap="round"/>
    <!-- Sparkle stars at hands -->
    <text x="74" y="48" font-size="12">✨</text>
    <text x="118" y="48" font-size="12">✨</text>
  </g>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#92400E" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">สปริงตัว ชูแขนสองข้างแตะฟ้า</text>
</svg>