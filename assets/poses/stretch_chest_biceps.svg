<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ECFDF5"/><stop offset="100%" stop-color="#D1FAE5"/></linearGradient></defs>
  <style>.chest { animation: chestOpen 2s ease-in-out infinite alternate; } @keyframes chestOpen { 0%{transform: translateX(0);} 100%{transform: translateX(3px);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#10B981" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#065F46"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🧘 ยืดอกและหัวไหล่ (Chest Opener)</text>
  <ellipse cx="100" cy="175" rx="35" ry="6" fill="#A7F3D0"/>
  <rect x="86" y="128" width="10" height="44" rx="4" fill="#047857"/>
  <rect x="104" y="128" width="10" height="44" rx="4" fill="#047857"/>
  <rect x="83" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.5"/>
  <rect x="103" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.5"/>
  <g class="chest">
    <!-- Torso arched slightly -->
    <rect x="84" y="90" width="34" height="40" rx="7" fill="#059669"/>
    <circle cx="100" cy="70" r="15" fill="#FCD34D"/><rect x="87" y="64" width="26" height="4.5" rx="2" fill="#EF4444"/>
    <!-- Chest highlight -->
    <ellipse cx="100" cy="102" rx="14" ry="8" fill="#F59E0B" opacity="0.6"/>
    <!-- Arms clasped behind back -->
    <path d="M84 96 Q65 110 76 122 Q88 126 100 126" stroke="#FCD34D" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M116 96 Q135 110 124 122 Q112 126 100 126" stroke="#FCD34D" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="126" r="6" fill="#F59E0B"/>
  </g>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#10B981" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#065F46" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ประสานมือหลังสะโพก แอ่นอกเปิดไหล่</text>
</svg>