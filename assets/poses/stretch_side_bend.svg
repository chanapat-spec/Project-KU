<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ECFDF5"/><stop offset="100%" stop-color="#D1FAE5"/></linearGradient></defs>
  <style>.side { animation: sideBend 2.5s ease-in-out infinite alternate; transform-origin: 100px 140px; } @keyframes sideBend { 0%{transform: rotate(0deg);} 100%{transform: rotate(14deg);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#10B981" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#065F46"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🧘 ยืดลำตัวด้านข้าง (Side Stretch)</text>
  <ellipse cx="100" cy="175" rx="35" ry="6" fill="#A7F3D0"/>
  <rect x="84" y="136" width="10" height="36" rx="4" fill="#047857"/>
  <rect x="106" y="136" width="10" height="36" rx="4" fill="#047857"/>
  <rect x="81" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.5"/>
  <rect x="105" y="166" width="14" height="8" rx="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.5"/>
  <g class="side">
    <rect x="82" y="98" width="36" height="38" rx="7" fill="#059669"/>
    <circle cx="100" cy="78" r="15" fill="#FCD34D"/><rect x="87" y="72" width="26" height="4.5" rx="2" fill="#EF4444"/>
    <!-- Left side rib highlight -->
    <path d="M82 104 Q80 118 84 128" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Left arm reaching overhead to right -->
    <path d="M82 98 Q76 68 116 54" stroke="#FCD34D" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Right arm resting on hip -->
    <path d="M118 98 Q124 112 114 118" stroke="#047857" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#10B981" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#065F46" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ชูแขนขึ้นฟ้า เอียงตัวยืดสีข้าง</text>
</svg>