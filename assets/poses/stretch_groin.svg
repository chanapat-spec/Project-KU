<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ECFDF5"/><stop offset="100%" stop-color="#D1FAE5"/></linearGradient></defs>
  <style>.groin { animation: sideShift 2.5s ease-in-out infinite alternate; } @keyframes sideShift { 0%{transform: translateX(0);} 100%{transform: translateX(6px);} }</style>
  <rect width="200" height="200" rx="24" fill="url(#bg)" stroke="#10B981" stroke-width="2"/>
  <rect x="15" y="15" width="170" height="26" rx="13" fill="#065F46"/>
  <text x="100" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">🧘 ยืดขาหนีบสะโพก (Side Groin Stretch)</text>
  <ellipse cx="100" cy="175" rx="55" ry="6" fill="#A7F3D0"/>
  <g class="groin">
    <!-- Left Leg Extended Straight Out -->
    <path d="M94 132 L58 152 L44 168" stroke="#047857" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="36" y="166" width="15" height="8" rx="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.5"/>
    <!-- Inner thigh highlight -->
    <path d="M82 138 L58 154" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <!-- Right Leg Bent Deep -->
    <path d="M104 132 L132 144 L132 168" stroke="#047857" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="126" y="166" width="15" height="8" rx="3" fill="#FFFFFF" stroke="#065F46" stroke-width="1.5"/>
    <!-- Torso Centered Lower -->
    <rect x="86" y="98" width="32" height="36" rx="7" fill="#059669"/>
    <circle cx="102" cy="80" r="14" fill="#FCD34D"/><rect x="90" y="74" width="24" height="4" rx="2" fill="#EF4444"/>
    <path d="M88 106 L82 134" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
    <path d="M114 106 L124 134" stroke="#FCD34D" stroke-width="6" stroke-linecap="round"/>
  </g>
  <rect x="25" y="178" width="150" height="16" rx="8" fill="#10B981" fill-opacity="0.2"/>
  <text x="100" y="190" fill="#065F46" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ยืนขากว้าง ย่อข้างยืดต้นขาด้านใน</text>
</svg>